[package]
name = "rsdk_mod_manager_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.8"
rust-ini = "0.21.3"
native-dialog = "0.9.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
cfg-if = "1.0.4"
eframe = { version = "0.33.3", optional = true }
egui_extras = { version = "0.33.3", optional = true }
egui = { version = "0.33.3", optional = true }
iced =  { version = "0.14.0", optional = true }
iced_aw = { version = "0.13.1", features = ["tab_bar", "tabs"], optional = true }
iced_core = { version = "0.14.0", optional = true }

[features]
egui = ["dep:eframe", "dep:egui_extras", "dep:egui"]
iced = ["dep:iced", "dep:iced_aw", "dep:iced_core"]
