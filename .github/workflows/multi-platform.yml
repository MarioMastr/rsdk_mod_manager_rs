on:
  workflow_dispatch:
  push:
    branches:
      - "**"

name: Build RSDK Mod Manager

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: ubuntu-latest
          target: x86_64-pc-windows-gnu

        - name: macOS arm64
          os: macos-latest
          target: aarch64-apple-darwin

        - name: macOS x86_64
          os: macos-latest
          target: x86_64-apple-darwin

        - name: Linux
          os: ubuntu-latest
          target: x86_64-unknown-linux-gnu

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v2
      - name: Install latest stable
        uses: actions-rs/toolchain@v1
        with:
            toolchain: stable
            override: true
            target: ${{ matrix.config.target }}

      - name: Build
        shell: bash
        run: |
          if [ ${{ matrix.config.target }} == "x86_64-pc-windows-gnu" ]; then
            sudo apt-get install mingw-w64 && cargo build --release --target ${{ matrix.config.target }}
          else
            cargo install --git https://github.com/burtonageo/cargo-bundle && cargo bundle --release --target ${{ matrix.config.target }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
            name: RSDK Mod Manager ${{ matrix.config.name }}
            path: ${{ github.workspace }}/target/${{ matrix.config.target }}
